services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user_api
      POSTGRES_PASSWORD: user_api
      POSTGRES_DB: user_api
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_api -d user_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user_api:user_api@db:5432/user_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Run pending Alembic migrations, then start the API.
    command: sh -c "alembic upgrade head && uvicorn user_api.adapters.inbound.http.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
